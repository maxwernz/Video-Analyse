name: Cross-platform source checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            os: macos-15
          - name: Windows x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.9.22"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Type-check portable runtime
        run: uv run mypy main.py app_runtime.py video_creator.py build_config/shared.py analysis

      - name: Run source checks
        run: uv run python -m pytest

  package-macos:
    name: macOS ARM64 package
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.9.22"
          enable-cache: true

      - name: Build the ARM64 macOS disk image
        run: ./scripts/build_macos.sh

      - name: Verify the packaged application
        run: uv run python -m pytest tests/test_macos_package.py
        env:
          VIDEO_ANALYSE_REQUIRE_PACKAGE: "1"

      - name: Upload the disk image
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-dmg
          path: dist/*.dmg
          if-no-files-found: error
