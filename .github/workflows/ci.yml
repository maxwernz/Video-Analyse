name: Cross-platform source checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            os: macos-15
          - name: Windows x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.9.22"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Type-check portable runtime
        run: uv run mypy main.py app_runtime.py video_creator.py build_config/shared.py build_config/windows_version_resource.py analysis

      - name: Run source checks
        run: uv run python -m pytest

  package-macos:
    name: macOS ARM64 package
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.9.22"
          enable-cache: true

      - name: Build the ARM64 macOS disk image
        run: ./scripts/build_macos.sh

      - name: Verify the packaged application
        run: uv run python -m pytest tests/test_macos_package.py
        env:
          VIDEO_ANALYSE_REQUIRE_PACKAGE: "1"

      - name: Upload the disk image
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-dmg
          path: dist/*.dmg
          if-no-files-found: error

  package-windows:
    name: Windows x64 package
    # The installer requires Windows 11 (build 22000), which rules out the
    # Windows Server 2022 image.
    runs-on: windows-2025

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.9.22"
          enable-cache: true

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the per-user Windows installer
        run: ./scripts/build_windows.ps1
        shell: pwsh

      - name: Verify the installer end to end
        # The gate turns "artifact missing" skips into failures, so this job
        # cannot report success for a verification that never ran.
        env:
          VIDEO_ANALYSE_REQUIRE_PACKAGE: "1"
        run: uv run python -m pytest tests/test_windows_package.py
        shell: pwsh

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-installer
          path: dist/*-x64-setup.exe
          if-no-files-found: error
